# Builds the mod and runs the GameTests. The finished jar is attached to the run as an artifact.
# Saves Actions minutes: Gradle cache, no runs for docs-only changes,
# older runs on the same branch are cancelled by a new push.

name: build
on:
  push:
    branches: [main, develop]
    paths-ignore: ['**.md', 'LICENSE', '.gitattributes', '.gitignore']
  pull_request:
    paths-ignore: ['**.md', 'LICENSE', '.gitattributes', '.gitignore']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: setup gradle (validates the wrapper and caches downloads)
        uses: gradle/actions/setup-gradle@v6
      - name: build
        run: ./gradlew build
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: explosivearrows
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
